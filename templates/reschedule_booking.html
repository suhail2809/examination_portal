<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reschedule Booking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #dbf4e3;
        }

        .navbar {
            background-color: #0d3d33;
        }

        .navbar-text {
            color: white;
        }

        .form-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <span class="navbar-text"> Examination Management Portal</span>

        <a href="{{ url_for('admin_manage_bookings') }}" class="btn btn-light">Back</a>
    </div>
</nav>

<div class="container">

    <div class="form-box">
        <h3 class="mb-4">Reschedule Booking</h3>
        <p>
            **Student:** {{ booking.student.name }}
        </p>

        <p>
            **Examination:** {{ booking.examination.title }}
        </p>

        <form method="POST">

            <label class="form-label">
                Select New Slot
            </label>

            <select name="slot_id" class="form-select mb-3" required>

                <option value="">Choose a slot</option>

                {% for slot in slots %}

                    <option value="{{ slot.slot_id }}">
                        {{ slot.date }}
                        | {{ slot.start_time }} - {{ slot.end_time }}
                        | Examiner: {{ slot.examiner.name }}
                        | Available Seats: {{ slot.available_seats }}
                    </option>

                {% endfor %}

            </select>

            <button type="submit" class="btn btn-success">
                Confirm Reschedule
            </button>

        </form>

    </div>

</div>

</body>
</html>
