<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slot creation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> 
    body{
            background-color: #dbf4e3;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #0d3d33;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }
        .form-container{
            margin-top: 50px;
            
        }
        .card{
            padding:50px;
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <span class="navbar-brand">Examination Management Portal</span>
            <a href="{{ url_for('logout') }}" class="btn btn-light">Logout</a>
        </div>
    </nav>
    <div class="container form-container">
        <div class="card mx-auto">
            <h3 class="mb-4">Create Exam slots</h3>

            <h5>{{ examination.title }}</h5>

            <form method="POST">

                <div class="mb-3">
                    <label for="date"  class="form-label">slot date</label>
                    <input type="date" name="date" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label   class="form-label">start time</label>
                    <input type="time" name="start_time" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label   class="form-label">end time</label>
                    <input type="time" name="end_time" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label   class="form-label">Capacity</label>
                    <input type="number" name="capacity" class="form-control" min="1" required>
                </div>

                <button type="submit" class="btn btn-success  "> Create Slots</button>
                <a href="{{url_for('examiner_dashboard')}}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
