
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Examination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #dbf4e3;
        }

        .navbar {
            background-color: #0d3d33;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .form-container {
            max-width: 800px;
            margin: 35px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #0d3d33;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-custom {
            background-color: #31796b;
            color: white;
        }

        .btn-custom:hover {
            background-color: #0d3d33;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('manage_exams') }}">
            Examination Management Portal
        </a>
    </div>
</nav>

<div class="container">
    <div class="form-container">

        <h2>Edit Examination</h2>

        <form method="POST">

            <!-- Examination Title -->
            <div class="mb-3">
                <label for="title" class="form-label">
                    Examination Title
                </label>

                <input type="text"
                       class="form-control"
                       id="title"
                       name="title"
                       value="{{ exam.title }}"
                       required>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label for="description" class="form-label">
                    Description
                </label>

                <textarea class="form-control"
                          id="description"
                          name="description"
                          rows="3">{{ exam.description or '' }}</textarea>
            </div>

            <!-- Examination Type -->
            <div class="mb-3">
                <label for="exam_type" class="form-label">
                    Examination Type
                </label>

                <select class="form-select"
                        id="exam_type"
                        name="exam_type"
                        required>

                    <option value="Viva"
                        {% if exam.exam_type == 'Viva' %}selected{% endif %}>
                        Viva
                    </option>

                    <option value="Practical"
                        {% if exam.exam_type == 'Practical' %}selected{% endif %}>
                        Practical
                    </option>

                    <option value="Project Demo"
                        {% if exam.exam_type == 'Project Demo' %}selected{% endif %}>
                        Project Demo
                    </option>

                    <option value="Assessment"
                        {% if exam.exam_type == 'Assessment' %}selected{% endif %}>
                        Assessment
                    </option>

                </select>
            </div>

            <!-- Duration -->
            <div class="mb-3">
                <label for="duration" class="form-label">
                    Duration (minutes)
                </label>

                <input type="number"
                       class="form-control"
                       id="duration"
                       name="duration"
                       min="1"
                       value="{{ exam.duration }}"
                       required>
            </div>

            <!-- Start Date -->
            <div class="mb-3">
                <label for="start_date" class="form-label">
                    Examination Start Date
                </label>

                <input type="date"
                       class="form-control"
                       id="start_date"
                       name="start_date"
                       
                       value="{{ exam.start_date.strftime('%Y-%m-%d') if exam.start_date else '' }}">
            </div>

            <!-- End Date -->
            <div class="mb-3">
                <label for="end_date" class="form-label">
                    Examination End Date
                </label>

                <input type="date"
                       class="form-control"
                       id="end_date"
                       name="end_date"
                       value="{{ exam.end_date.strftime('%Y-%m-%d') if exam.end_date else '' }}">
            </div>

            <!-- Slot Creation Start -->
            <div class="mb-3">
                <label for="slot_creation_start" class="form-label">
                    Slot Creation Start
                </label>

                <input type="datetime-local"
                       class="form-control"
                       id="slot_creation_start"
                       name="slot_creation_start"
                       value="{{ exam.slot_creation_start.strftime('%Y-%m-%dT%H:%M') if exam.slot_creation_start else '' }}">
            </div>

            <!-- Slot Creation End -->
            <div class="mb-3">
                <label for="slot_creation_end" class="form-label">
                    Slot Creation End
                </label>

                <input type="datetime-local"
                       class="form-control"
                       id="slot_creation_end"
                       name="slot_creation_end"
                       value="{{ exam.slot_creation_end.strftime('%Y-%m-%dT%H:%M') if exam.slot_creation_end else '' }}">
            </div>

            <!-- Booking Start -->
            <div class="mb-3">
                <label for="booking_start" class="form-label">
                    Booking Start
                </label>

                <input type="datetime-local"
                       class="form-control"
                       id="booking_start"
                       name="booking_start"
                       value="{{ exam.booking_start.strftime('%Y-%m-%dT%H:%M') if exam.booking_start else '' }}">
            </div>

            <!-- Booking End -->
            <div class="mb-3">
                <label for="booking_end" class="form-label">
                    Booking End
                </label>

                <input type="datetime-local"
                       class="form-control"
                       id="booking_end"
                       name="booking_end"
                       value="{{ exam.booking_end.strftime('%Y-%m-%dT%H:%M') if exam.booking_end else '' }}">
            </div>

            <!-- Maximum Marks -->
            <div class="mb-4">
                <label for="max_marks" class="form-label">
                    Maximum Marks
                </label>

                <input type="number"
                       class="form-control"
                       id="max_marks"
                       name="max_marks"
                       min="1"
                       value="{{ exam.max_marks }}"
                       required>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn btn-custom">
                    Save Changes
                </button>

                <a href="{{ url_for('manage_exams') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
