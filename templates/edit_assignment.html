
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background-color: #dbf4e3; }
        .navbar { background-color: #0d3d33; }
        .btn-custom { background-color: #31796b; color: white; }
        .btn-custom:hover { background-color: #245d52; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">
                EMP - Admin
            </a>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 650px;">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="mb-4">Edit Assignment</h3>

            <p>
                <strong>Examination:</strong>
                {{ assignment.examination.title }}
            </p>

            <p>
                <strong>Current Examiner:</strong>
                {{ assignment.examiner.name }}
            </p>

            <form method="POST"
                  action="{{ url_for('edit_assignment', assignment_id=assignment.assignment_id) }}">

                <div class="mb-3">
                    <label for="examiner_id" class="form-label">
                        Select New Examiner
                    </label>

                    <select name="examiner_id" id="examiner_id"
                            class="form-select" required>
                        <option value="">Choose an examiner</option>

                        {% for examiner in examiners %}
                            <option value="{{ examiner.user_id }}"
                                {% if examiner.user_id == assignment.examiner_id %}
                                    selected
                                {% endif %}>
                                {{ examiner.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-custom">
                        Save Changes
                    </button>

                    <a href="{{ url_for('assign_examiners') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
