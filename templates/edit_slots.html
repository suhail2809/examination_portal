
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Exam Slots</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #dbf4e3;
        }

        .navbar {
            background-color: #0d3d33;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .form-container {
            max-width: 800px;
            margin: 35px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #0d3d33;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-custom {
            background-color: #31796b;
            color: white;
        }

        .btn-custom:hover {
            background-color: #0d3d33;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('manage_slots') }}">
            Examination Management Portal
        </a>
    </div>
</nav>

<div class="container">
    <div class="form-container">

        <h2>Edit Exam Slots</h2>

        <form method="POST">
            <div class="mb-3">
                <label for="date" class="form-label">
                    Slot date 
                </label>

                <input type="date"
                        class="form-control"
                        id="date"
                        name="date"
                        value="{{ slot.date.isoformat() }}" required>
            </div>

            
            <div class="mb-3">
                <label for="start_time" class="form-label">
                    Start Time
                </label>

                <input type="time" class="form-control"
                            id="start_time"
                            name="start_time"
                            value = "{{ slot.start_time.strftime('%H:%M')}}" required>
                            
            </div>
            <div class="mb-3">
                <label for="end_time" class="form-label">
                    End Time
                </label>

                <input class="form-control" type="time"
                            id="end_time"
                            name="end_time"
                            value = "{{ slot.end_time.strftime('%H:%M') }}" required>
                            
            </div>
            <div class="mb-3">
                <label for="capacity" class="form-label">
                    Capacity
                </label>

                <input class="form-control" type=""number
                            id="capacity"
                            name="capacity"
                            value = "{{ slot.capacity }}" min="1" required>
                            
            </div>

            
        <div class="text-center">
            <button class="btn btn-custom" type="submit">Save Changes </button>

            <a href="{{url_for('manage_slots')}}" class="btn btn-secondary">Cancel</a>
        </div>

        </form>
    </div>
</div>

</body>
</html>
