
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #dbf4e3;
        }

        .navbar {
            background-color: #0d3d33;
        }

        .edit-card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: 35px;
        }

        .btn-green {
            background-color: #31796b;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand">Examination Management Portal</span>
        <a href="{{ url_for('manage_courses') }}"
            class="btn btn-light btn-sm">Back to Courses</a>
    </div>
</nav>

<div class="container">
    <div class="edit-card">
        <h3 class="mb-4">Edit Course</h3>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Course Code</label>
                <input type="text" name="course_code" class="form-control" value="{{ course.course_code }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text" name="course_name"
                       class="form-control"
                       value="{{ course.course_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="descriptions" class="form-control" rows="3">{{ course.descriptions or '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-green">
                Save Changes
            </button>

            <a href="{{ url_for('manage_courses') }}"
               class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
