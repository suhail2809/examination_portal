<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign examiners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #dbf4e3;
        }

        .navbar {
            background-color: #0d3d33;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .form-container {
            max-width: 800px;
            margin: 35px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            
        }

        h2 {
            color: #0d3d33;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-custom {
            background-color: #31796b;
            color: white;
        }

        .btn-custom:hover {
            background-color: #0d3d33;
            color: white;
        }
</style>
</head>

<body>
    <nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">
            EMP | Admin
        </a>
        <a href="{{ url_for('logout') }}" class="btn  btn-light btn-sm">
            Logout
        </a>
    </div>
</nav>

    <div class="container py-5">
        <div class="card  p-4">
            <h3 class="mb-4">Assign Examiner to Examination</h3>
    

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="{{url_for('assign_examiners')}}" method="POST">
            
            <div class="mb-3">
                <label for="examination_id" class="form-label">Select Examination</label>
                <select name="examination_id" id="examination_id" class="form-select" required>
                    <option value="Choose an examination"></option>
                    {% for exam in examinations %}
                        <option value="{{ exam.exam_id }}">{{ exam.title }}</option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label for="examiner_id" class="form-label">Select Examiner to assign</label>
                <select name="examiner_id" id="examiner_id" class="form-select" required>
                    <option value="Choose Examiner"></option>
                    {% for examiner in examiners %}
                        <option value="{{ examiner.user_id }}">{{ examiner.name }}</option>
                    {% endfor %}

                </select>
            </div>

           <div class="text-center"> <button class="btn btn-custom " type=""submit> Assign Examiner</button>

            <a href="{{ url_for('admin_dashboard')}}" class="btn btn-secondary"">BAck to Dashboard</a></div>
        </form>
    </div>
    </div>
</body>
</html>
