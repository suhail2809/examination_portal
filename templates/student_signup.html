
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Signup </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #dbf4e3;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #0d3d33;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .signup-card {
            max-width: 500px;
            margin: 190px auto;
            
            padding: 30px;
            background-color: white;
            border-radius: 14px;
        }

        .btn-button {
            background-color: #218653;
            color: white;
            border: none;
        }

        .btn-button:hover {
            background-color: #125532;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('index') }}" class="navbar-brand">
                Examination Management Portal
            </a>
        </div>
    </nav>

    <div class="container">

        <div class="signup-card">

            <h2 class="text-center fw-bold mb-2">
                Student Signup
            </h2>

            <p class="text-center text-secondary mb-4">
                Create your student account
            </p>

            <form method="POST">

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label" required>
                        Email
                    </label>

                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>

                    <input type="password"    class="form-control"  id="password" name="password" required>
                </div>

                <div class="mb-4">
                    <label for="contact" class="form-label">  Contact  </label>

                    <input type="tel" class="form-control" id="contact"  name="contact"  required>
                </div>

                <button type="submit" class="btn btn-button w-100 p-2"> Create Account</button>

            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="{{ url_for('student_login') }}">Login here</a>
            </p>

            <p class="text-center mt-3 mb-0">
                <a href="{{ url_for('index') }}" class="text-secondary">Back to Home</a>
            </p>

        </div>

    </div>

</body>
</html>
